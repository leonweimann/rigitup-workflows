# LIBRARY — called by other repositories, never runs on its own. It sits in
# .github/workflows/ only because GitHub accepts reusable workflows nowhere
# else. This repository's own CI is self-check.yaml.
name: Deploy to Dokploy

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment holding the Dokploy credentials.
        required: true
        type: string
      app:
        description: Service name in compose.dokploy.yaml, also the image name.
        required: true
        type: string
      version:
        description: Version without the leading v.
        required: true
        type: string
      tag:
        description: Released tag, including the leading v.
        required: true
        type: string
      sha:
        description: Released commit on main.
        required: true
        type: string
      digest:
        description: Digest of the released image.
        required: true
        type: string
      release_url:
        description: URL of the published release.
        required: false
        type: string
      dry-run:
        description: Verify everything but leave Dokploy untouched.
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    runs-on: ubuntu-latest
    # A uses: job cannot carry environment:, so the environment is entered
    # here. Measured: that alone does NOT hand the environment secret to a
    # called workflow. The caller has to add secrets: inherit as well.
    environment: ${{ inputs.environment }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Require the API key
        env:
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
        run: |
          set -euo pipefail
          [ -n "$DOKPLOY_API_KEY" ] || {
            echo "::error::DOKPLOY_API_KEY is empty — does the caller pass secrets: inherit?"
            exit 1
          }
          echo "the environment secret is present"

      # The application repository carries compose.dokploy.yaml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - id: scripts
        uses: leonweimann/rigitup-workflows/.github/actions/scripts@f5130146cdffc848aaa255ca04ba7cd947438b10 # main

      - name: Take the digest from the published release
        id: manifest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          APP: ${{ inputs.app }}
          EXPECTED_DIGEST: ${{ inputs.digest }}
          EXPECTED_SHA: ${{ inputs.sha }}
          MANIFEST_DIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern release-manifest.json --dir "$MANIFEST_DIR" --clobber
          manifest=$MANIFEST_DIR/release-manifest.json

          digest=$(jq -r --arg app "$APP" '.images[$app].digest // empty' "$manifest")
          repository=$(jq -r --arg app "$APP" '.images[$app].repository // empty' "$manifest")
          commit=$(jq -r '.commit // empty' "$manifest")

          [ -n "$digest" ] || { echo "::error::the release manifest has no digest for $APP"; exit 1; }
          [ "$digest" = "$EXPECTED_DIGEST" ] || {
            echo "::error::the release manifest says $digest, the caller passed $EXPECTED_DIGEST"
            exit 1
          }
          [ "$commit" = "$EXPECTED_SHA" ] || {
            echo "::error::the release manifest names commit $commit, expected $EXPECTED_SHA"
            exit 1
          }

          echo "image=$repository@$digest" >> "$GITHUB_OUTPUT"
          echo "deploying $repository@$digest"

      - name: Deploy
        id: dokploy
        env:
          SCRIPTS: ${{ steps.scripts.outputs.path }}
          # A dry run unless the environment explicitly enables deployment.
          DRY_RUN: ${{ (inputs.dry-run || vars.PRODUCTION_DEPLOY_ENABLED != 'true') && 'true' || 'false' }}
          APP: ${{ inputs.app }}
          APP_IMAGE: ${{ steps.manifest.outputs.image }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ inputs.sha }}
          DOKPLOY_BASE_URL: ${{ vars.DOKPLOY_BASE_URL }}
          DOKPLOY_COMPOSE_ID: ${{ vars.DOKPLOY_COMPOSE_ID }}
          DOKPLOY_DEPLOY_TIMEOUT_SECONDS: ${{ vars.DOKPLOY_DEPLOY_TIMEOUT_SECONDS || '900' }}
          DOKPLOY_HEALTH_TIMEOUT_SECONDS: ${{ vars.DOKPLOY_HEALTH_TIMEOUT_SECONDS || '120' }}
          PRODUCTION_APP_URL: ${{ vars.PRODUCTION_APP_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
        run: |
          "$SCRIPTS/scripts/deploy/dokploy/deploy.sh"

      - name: Summarize
        if: always()
        env:
          TAG: ${{ inputs.tag }}
          IMAGE: ${{ steps.manifest.outputs.image }}
          RELEASE_URL: ${{ inputs.release_url }}
          DEPLOYMENT_ID: ${{ steps.dokploy.outputs.deployment_id }}
          ROLLBACK_OUTCOME: ${{ steps.dokploy.outputs.rollback_outcome }}
        run: |
          set -euo pipefail
          {
            echo "### Deployment $TAG"
            echo
            echo "- Image: \`$IMAGE\`"
            [ -n "$RELEASE_URL" ] && echo "- Release: $RELEASE_URL"
            [ -n "$DEPLOYMENT_ID" ] && echo "- Dokploy deployment: \`$DEPLOYMENT_ID\`"
            [ -n "$ROLLBACK_OUTCOME" ] && echo "- Rollback: $ROLLBACK_OUTCOME"
          } >> "$GITHUB_STEP_SUMMARY"
