name: Setup Python and uv
description: Installs uv with a warm cache and syncs the virtualenv.

inputs:
  python-version:
    description: Python version to install. Overrides .python-version.
    required: false
    default: "3.14"

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
      with:
        enable-cache: true
        cache-dependency-glob: uv.lock
        python-version: ${{ inputs.python-version }}

    - name: Sync dependencies
      shell: bash
      run: uv sync --frozen
