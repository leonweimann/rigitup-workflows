name: Setup Python and uv
description: Installs uv with a warm cache and syncs the virtualenv.

inputs:
  python-version:
    description: Python version to install. Overrides .python-version.
    required: false
    default: "3.14"

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        enable-cache: true
        cache-dependency-glob: uv.lock
        python-version: ${{ inputs.python-version }}

    - name: Sync dependencies
      shell: bash
      run: uv sync --frozen
